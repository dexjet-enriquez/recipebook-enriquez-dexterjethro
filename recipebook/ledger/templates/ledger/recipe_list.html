{% extends 'base.html' %} 
{% load static %}
{% block title %}Recipe List{% endblock %} 
{% block page_heading %}Recipe List{% endblock %}
{% block content %}
  <ul>
    {% for recipe in recipes %}
    <li>
      <a href="{{ recipe.get_absolute_url }}"> {{ recipe.name }}</a>
    </li>
    {% endfor %}
  </ul>
  <hr>
  <p> Got a recipe in mind? <a href="{% url 'ledger:recipe-add' %}">Add a Recipe</a></p>
  
{% endblock %}
